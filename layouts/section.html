{{- define "main" }}
    <h1>{{ .Title }}</h1>
    <div class="content{{- if .Param "book-style" }} book-style{{- end }}{{- if .Param "drop-cap" }} drop-cap{{- end }}">
        {{ .Content }}
    </div>
    <div class="pages">
        <dl>
        {{- range .Pages }}
        <dt><a href="{{ .RelPermalink }}">{{ .Title }}</a></dt>
        <dd>{{ .Description }}</dd>
        {{- end }}
        </dl>
    </div>
{{- end }}
