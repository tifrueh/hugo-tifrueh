{{ if (or (.Param "math") (.Store.Get "hasMath")) }}
<script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js"></script>
<script>
  MathJax = {
    tex: {
      displayMath: [['$$', '$$']],  // block
      inlineMath: [['$', '$']]      // inline
    },
    loader:{
      load: ['ui/safe']
    },
    output: {
      displayOverflow: 'scroll',
    },
  };
</script>
{{ end }}
